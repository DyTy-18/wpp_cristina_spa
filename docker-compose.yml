version: "3"

services:
  wppconnect:
    container_name: wpp-server
    restart: unless-stopped
    build:
      context: .
    env_file:
      - .env
    volumes:
      - wpp_tokens:/usr/src/wpp-server/tokens
      - wpp_user_data:/usr/src/wpp-server/userDataDir
      - wpp_data:/usr/src/wpp-server/data
    ports:
      - "21465:21465"

volumes:
  wpp_tokens: {}
  wpp_user_data: {}
  wpp_data: {}
